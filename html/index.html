<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="scoreboard" class="scoreboard hidden">
        <div class="scoreboard-container">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <h1 class="title">SCOREBOARD</h1>
                    <span class="server-name" id="serverName">  </span>
                </div>
                <div class="header-right">
                    <div class="players-info">
                        <span class="players-label">Players Online</span>
                        <div class="players-count">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span id="playersOnline">0</span>
                            <span class="separator">/</span>
                            <span id="maxPlayers">256</span>
                        </div>
                    </div>
                    <button class="exit-btn">
                        Exit
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Job Stats -->
            <div class="job-stats" id="jobStatsContainer">
            </div>

            <!-- Filters & Search -->
            <div class="filters-header">
                <div class="filter-tabs" id="filterTabsContainer">
                    <button class="tab-btn active" data-filter="all">All</button>
                </div>
                <div class="search-container">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search Name or ID...">
                </div>
            </div>

            <!-- Players Grid -->
            <div class="table-container">
                <div class="players-grid" id="playersGrid">
                    <!-- Players will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
